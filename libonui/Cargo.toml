[workspace]
resolver = "2"
members = [
    "crates/libonui-core",
    "crates/libonui-app",
    "crates/libonui-cli",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
authors = ["LibonOS"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
rand = "0.8"
sha2 = "0.10"
dirs = "5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
